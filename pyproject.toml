[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qwen-harness"
version = "0.1.0"
description = "A small, typed CLI harness for running Qwen through Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
qwen-harness = "qwen_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

